name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /app/mind

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Writing environment configuration..."
            cat > .env << EOF
            POSTGRES_USER=mindbridge
            POSTGRES_PASSWORD=mindbridge123
            POSTGRES_DB=mindbridge
            JWT_SECRET=mind-bridge-prod-secret
            CLIENT_URL=http://localhost
            EOF

            echo "==> Restarting containers..."
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml build --pull never
            docker compose -f docker-compose.prod.yml up -d

            echo "==> Cleaning up..."
            docker image prune -f

            echo "==> Deploy complete!"
