name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and save images
        run: |
          docker pull node:20-alpine
          docker pull nginx:alpine
          docker build -t mindbridge-server:latest ./server
          docker build -t mindbridge-client:latest ./client
          docker save node:20-alpine nginx:alpine mindbridge-server:latest mindbridge-client:latest -o /tmp/images.tar

      - name: Copy images to server
        uses: appleboy/scp-action@v0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: /tmp/images.tar
          target: /tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /app/mind

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Writing environment configuration..."
            cat > .env << EOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CLIENT_URL=http://${{ secrets.SSH_HOST }}
            EOF

            echo "==> Loading Docker images..."
            docker load -i /tmp/images.tar

            echo "==> Restarting containers..."
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --pull never

            echo "==> Cleaning up..."
            docker image prune -f
            rm -f /tmp/images.tar

            echo "==> Waiting for server health..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' mindbridge-server 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "==> Server is healthy!"
                break
              fi
              echo "   Attempt $i/30: server status is '$STATUS', waiting..."
              sleep 5
            done

            echo "==> Deploy complete!"
