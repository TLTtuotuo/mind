version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mindbridge-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mindbridge
    # Do NOT expose 5432 to the host in production

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mindbridge-server
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3001"
      CLIENT_URL: ${CLIENT_URL}
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mindbridge

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mindbridge-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mindbridge

volumes:
  pgdata:
    driver: local

networks:
  mindbridge:
    driver: bridge
