version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mindbridge-db
    environment:
      POSTGRES_USER: mindbridge
      POSTGRES_PASSWORD: mindbridge123
      POSTGRES_DB: mindbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mindbridge-server
    environment:
      DATABASE_URL: "postgresql://mindbridge:mindbridge123@postgres:5432/mindbridge?schema=public"
      JWT_SECRET: "${JWT_SECRET:-mind-bridge-production-secret}"
      PORT: "3001"
      CLIENT_URL: "${CLIENT_URL:-http://localhost:5173}"
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mindbridge-client
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
